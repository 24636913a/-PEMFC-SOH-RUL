  otherwise: F2_VALIDATION_GAIN_NOT_TRANSFERRED_TO_ASSESSMENT
  additional_descriptive_labels: seed-dependent if either count=1/2; non-transfer
    if count_F2_F0=0 or mean_F2_F0_difference>=0; ties not improvements
