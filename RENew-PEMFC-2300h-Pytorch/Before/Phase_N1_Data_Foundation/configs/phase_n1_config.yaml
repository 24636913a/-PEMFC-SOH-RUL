phase_name: "Phase N1 — Data Foundation, Sampling Resolution and SOH Target Construction"
raw_data_root: "E:/沈农信电/课题-预测质子交换膜燃料电池（PEMFC）的健康状态和剩余寿命/数据/《耐久性测试期间PEM燃料电池堆的空间解析电化学表征》的基础数据"
project_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch"
phase_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch/Phase_N1_Data_Foundation"

ageing_coordinate: "OpHrs2 [h]"
datetime_column: "DateTime"
forbidden_primary_ageing_coordinate: "OpHrs [h]"
csv_separator: ";"
csv_encoding: "utf-8-sig"
chunk_rows: 200000

split:
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
  assignment: "full-bin containment"

aggregation:
  resolutions_hours: [0.5, 1.0]
  coverage_threshold: 0.80
  coverage_sensitivity_thresholds: [0.70, 0.90]
  zero_current_abs_threshold_A: 0.10
  load_transition_abs_threshold_A: 5.0
  raw_gap_min_seconds: 5.0
  raw_gap_interval_multiplier: 5.0
  bin_interval: "left-closed-right-open"

active_cell_audit:
  candidate_channels:
    - "U1 [V]"
    - "U2 [V]"
    - "U3 [V]"
    - "U4 [V]"
    - "U5 [V]"
    - "U6 [V]"
    - "U7 [V]"
    - "U8 [V]"
    - "U9 [V]"
    - "U10 [V]"
    - "U11 [V]"
  expected_active_channels:
    - "U1 [V]"
    - "U2 [V]"
    - "U3 [V]"
    - "U4 [V]"
    - "U5 [V]"
    - "U7 [V]"
    - "U8 [V]"
    - "U9 [V]"
    - "U10 [V]"
    - "U11 [V]"
  expected_inactive_channel: "U6 [V]"
  flatline_abs_delta_V: 0.000001
  quantile_stride: 10
  minimum_physical_loaded_median_V: 0.20

polarization:
  candidate_jstar_A_cm2: [0.8, 1.0, 1.2, 1.4, 1.6]
  current_density_tolerance_A_cm2: 0.01
  lower_voltage_limit_V: 0.50
  minimum_lower_limit_margin_V: 0.05
  checkpoints_h: [0, 300, 600, 850, 1150, 1500, 1750, 2000, 2300]
  after_air_air_checkpoints_h: [1500, 2300]
  selection_scope: "train+validation only"

temporal:
  lookback_hours: [12, 24, 48]
  horizon_hours: [4, 8, 12, 24]
  additional_horizon_hours: [48]
  acf_max_lag_hours: 72
  spectral_period_min_hours: 2
  spectral_period_max_hours: 48

forecasting:
  primary_target: "delta_cell_voltage_from_origin"
  secondary_target: "absolute_cell_voltage"
  scenario_a: "future-unknown forecasting"
  scenario_b: "known-duty-cycle forecasting using protocol-defined future set points only"
  strict_rul_ground_truth: false

random_seed: 20260905
