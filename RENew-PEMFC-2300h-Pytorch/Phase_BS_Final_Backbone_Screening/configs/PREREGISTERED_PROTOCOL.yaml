scope:
  dataset: RealHyFC
  development_only: true
  test_access: prohibited
  raw_data_access: prohibited
  external_feature_decomposition: prohibited
  forbidden_external_methods: [wavelet, SWT, VMD, EMD, EEMD, CEEMDAN]
