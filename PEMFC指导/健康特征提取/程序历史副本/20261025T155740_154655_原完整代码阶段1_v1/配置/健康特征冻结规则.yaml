版本: 阶段1_v1
研究身份: 离线描述性特征与重构可靠性分析，非未来预测
输入表目录: 数据处理/输出结果/表格
候选曲线: 阶段0登记的全部19条；17条主曲线，2条启停后单列
基准: {FC1: FC1_Pola_T000.xlsx, RealHyFC: Polcurve_Nominal_RHFC_BoL.csv}
共同网格: {起点: 0.30, 终点: 1.00, 步长: 0.05, j_ref: 0.9}
扫描: {方向: -1, 确认幅度: 0.05, 选取: 最早覆盖完整共同区间的降载分段，不合并其他扫描}
RealHyFC:
  设定电流变化阈值_A: 0.1
  最短平台秒: 180
  末尾窗口秒: 60
  最大相邻间隔秒: 1.05
  电流密度峰峰上限: 0.01
  电压P95减P5上限_V: 0.005
  电压斜率绝对值上限_V_s: 0.00002
  冷却液温度峰峰上限_C: 1.0
  入口压力峰峰上限_kPa: 3.0
  代表值: 末尾窗口原始观测均值
FC1:
  电流密度分组宽度: 0.01
  最少组内点数: 15
  代表值: 窄电流分组中位数；无时间，不能认证稳态
插值:
  类型: 相邻合格代表点分段线性，严格禁止外推
  最大括距: 0.20
  缺失处理: 保留NA，仅在BoL和本次曲线共同受支持网格上拟合
  不跨越: 扫描方向和测试文件
拟合:
  方法: 梯形积分电流区间权重最小二乘，权重与原始采样密度无关
  最少网格数: 10
  最小电流跨度: 0.50
  参数: l1加l2乘j除以j_ref；两个分量单位V，保留符号
  一维对照: 同网格同权重的常数损失
  负载留组: 5个连续电流组轮流留出；仅重构诊断，不是时间预测
稳定性:
  方案: [主规则, FC1窄分组, FC1宽分组, 末30秒, 末90秒, 严格稳态]
  FC1宽度对照: [0.005, 0.02]
  严格电压波动上限_V: 0.003
  条件扰动次数: 300
  扰动种子: 20261025
  扰动方式: 每个代表点按原顺序分5块，块均值或中位数随机重采样；BoL共享；不是独立重复测试置信区间
  最大参数绝对改变量_V: 0.005
  最大参数相对改变量: 0.25
  相对尺度下限_V: 0.01
可靠性判据:
  二维重构RMSE上限_V: 0.005
  负载留组相对改善至少: 0.20
  负载留组绝对改善至少_V: 0.001
  加权设计矩阵条件数上限: 30
  参数相关系数绝对值上限: 0.98
  判定: 同时检查负载留组改善、扰动符号、条件数及处理敏感性；数值通过仍不替代稳态和时间资格
禁止: 外推、高阶全局曲线、截断负损失、未来预测选规则、神经训练、SOH/RUL预测、自动Git提交
跨文件工况描述阈值: {冷却液温差_C: 2.0, 入口压差_kPa: 5.0, 说明: 仅标记与BoL的观测差异，不宣称测量等价}
