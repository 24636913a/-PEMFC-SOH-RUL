版本: 阶段1.1_DIAGNOSTIC_ONLY_v1
身份: DIAGNOSTIC_ONLY
原阶段1规则: 健康特征提取/配置/健康特征冻结规则.yaml
原结果: 健康特征提取/输出结果/历史核验/20261025T153526_430847
曲线: 全部11条RealHyFC名义极化文件；9条主曲线与2条启停后分开解释
方向: 最早完整降载扫描；不与升载合并
诊断组:
  - {名称: A30, 温度限制: true, 末尾秒: 30}
  - {名称: A60, 温度限制: true, 末尾秒: 60}
  - {名称: A90, 温度限制: true, 末尾秒: 90}
  - {名称: B30, 温度限制: false, 末尾秒: 30}
  - {名称: B60, 温度限制: false, 末尾秒: 60}
  - {名称: B90, 温度限制: false, 末尾秒: 90}
其他规则: 严格继承阶段1原配置；B只取消冷却液温度峰峰限制，不取消缺失、漂移或压力要求
网格与插值: 严格继承0.30至1.00步长0.05，局部括距0.20，不外推，10格及跨度0.50
额外方案D: 不执行；论文仅给名义温度及停留协议，没有传感器精度或可替代的已验证温度阈值
平台范围:
  全部: 每文件全部扫描内连续同设定电流段，按方向和分段独立标记
  主要诊断: 阶段1相同最早完整降载段全部候选，单列至少180秒
  历史69队列: 0.2至1.1 A/cm²附近77个长平台中原A60温度拒绝的69个；包含启停后曲线
原始时间图: 每个扫描内至少180秒的平台分别画图，保留全部原始行；不只挑有利案例
规则归因: 多标签边际排除数与仅单项失败数分开；测量行数用原始平台行与末窗口行分别报告，不能跨重叠方案相加
动态诊断:
  窗口: [30,60,90]
  阶段: 全平台、前60秒、末30秒、末60秒、末90秒
  温压电压相关: 平台内原值及一阶差分Pearson；不作因果推断或显著性检验
  滞后: 固定正负10秒，完整报告全部滞后，不择优解释为传感器延迟
  频谱: 去线性趋势后最强离散频率及频谱浓度，仅为周期性诊断，不识别控制器
二维诊断:
  支持范围: 每条曲线BoL交集、各方案全部主曲线共同交集分别记录
  稳定性: 同一文件不同方案在同一受支持网格上复算参数，不混淆支持域变化
  参数阈值: 仅引用原阶段1的5mV及相对25%作为诊断标记，不升级为正式特征资格
  不确定性: 条件分块扰动100次；固定种子20261025；不是独立重复曲线置信区间
图像: 300dpi PNG，必要汇总图保存PDF；所有图基于真实CSV
停止规则: 一次六组诊断后停止，不新增阈值搜索、不选最优方案、不进入退化训练
