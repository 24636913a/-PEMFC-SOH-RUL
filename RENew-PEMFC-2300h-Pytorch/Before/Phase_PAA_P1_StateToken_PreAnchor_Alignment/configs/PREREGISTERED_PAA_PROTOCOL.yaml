phase: Phase_PAA_P1_StateToken_PreAnchor_Alignment
analysis_designation: POSTHOC_EXPLORATORY
base_head: c0c56d1e3299e6f5a360ce263a34f66c119ac110
original_results_preserved:
  RCR: RAW_CYCLE_STRUCTURE_QUALIFIED
  RHA: CONDITION_COMMON_SUPPORT_INSUFFICIENT
  RHA_P1: P1_ANCHOR_ALIGNMENT_INCONCLUSIVE
  may_be_modified: false
new_estimand: P1S_fixed_state_token_pre_anchor_operating_voltage_retention
frozen_cycle_structure:
  complete_cycles: 146
  age_stratum_complete_cycles: {EARLY: 50, MIDDLE: 45, LATE: 51}
  anchor_pattern: ['15||14.000', '15||0.000']
  complete_cycle_reuse_only: true
  partial_intervals_anchor_local_only: true
  prohibited: [cycle_rediscovery, cycle_catalog_rewrite, voltage_based_rephasing, SOH_based_rephasing, DTW]
P1_state_token_selection:
  operation_point: '221'
  eligible_tokens_from_frozen_RCR_template:
    '221||221.200': 93
    '221||156.800': 48
    '221||313.600': 25
  primary_token: '221||221.200'
  primary_set_current_A: 221.200
  rule: highest_frequency_eligible_P1_state_token_in_frozen_RCR_template
  forbidden_selection_inputs: [voltage, age_trend, polarization, SOH, correlation]
  no_alternate_token_fallback: true
stable_dwell:
  duration_wall_s_min: 120
  primary_window: middle_50_percent_of_run_time
  sensitivity_window: last_25_percent_of_run_time
  active_cells: ['U1 [V]', 'U2 [V]', 'U3 [V]', 'U4 [V]', 'U5 [V]', 'U7 [V]', 'U8 [V]', 'U9 [V]', 'U10 [V]', 'U11 [V]']
  excluded_cells: ['U6 [V]']
  dwell_measurement: median_of_active_cell_mean_voltage_and_each_condition
  interval_measurement: median_of_eligible_dwell_measurements_within_interval
conditions: [current_density, anode_inlet_temperature_C, anode_inlet_pressure_kPag, anode_inlet_RH_pct, anode_hydrogen_flow_nl_min, anode_stoichiometry, cathode_stoichiometry]
reference:
  source: earliest_10_legal_complete_Development_cycle_intervals_with_P1S_measurement
  reference_window: middle_50_percent_of_run_time
  last_25_sensitivity_uses_same_middle_50_reference_voltage: true
  partial_intervals_forbidden: true
  excluded_from_early_evaluation: true
  representation: R_c_P1S_equals_V_c_P1S_divided_by_median_V_reference_P1S
  representation_name: P1S_Operating_Voltage_Retention
  prohibited_name: SOH
support_and_drift:
  complete_cycle_measurements_min_per_stratum: 20
  seven_condition_complete_rate_min: 0.90
  joint_common_support_min_per_stratum: 15
  long_term_contrast: median_R_LATE_minus_median_R_EARLY
  required_direction: negative
  local_variation: median_absolute_adjacent_complete_cycle_R_difference_within_stratum
  local_signal_rule: absolute_D_greater_than_2_times_S
  bootstrap: {primary_block_cycles: 4, sensitivity_block_cycles: 8, iterations: 2000, seed: 2024, primary_CI_upper_less_than_zero: true, sensitivity_direction_negative: true}
matching:
  population: P1S_joint_common_support_complete_cycle_EARLY_and_LATE
  method: deterministic_nearest_condition_matching_without_replacement
  variables: all_7_frozen_conditions
  scaling: median_and_IQR_from_REFERENCE_plus_EARLY_complete_cycle_measurements
  iqr_zero_fallback: standard_deviation
  constant_variables: record_and_exclude_from_distance
  forbidden: [voltage, age, polarization, SOH]
  no_distance_cutoff: true
  primary_rule: raw_and_matched_contrasts_negative
  descriptive_distance_statistics: [median, p75, p90, max]
  balance_audit: [matched_early_median, matched_late_median, standardized_median_difference, standardized_mean_difference]
partial_interval_characterization_metadata:
  cutoff_definition: last_frozen_RCR_run_end_before_the_preselected_characterization_gap; all selected dwells must end strictly earlier
  anchors:
    - {checkpoint_h: 300, incomplete_raw_cycle_id: 25, cycle_start_run_id: 16920, pre_characterization_last_run_id: 17343, pre_characterization_cutoff_datetime: '2025-02-09T00:17:49.005000', pre_characterization_cutoff_ophrs2_h: 312.15411}
