phase: Phase_PI_PDFNet_Inspired_Exploration
model_name: PDFNetInspired_Exploratory
status: FROZEN_BEFORE_ANY_DEVELOPMENT_PERFORMANCE
formal_backbone_change: prohibited
seed42_gate:
  strongly_promising:
    formal_RMSE_fraction_of_TimesNet: 0.97
    fold3_RMSE_max_fraction: 1.10
    p99_max_fraction: 1.10
    target_time_equal_max_fraction: 1.10
    fold3_target_time_equal_max_fraction: 1.15
    endpoint_12h_max_fraction: 1.15
  promising_A:
    formal_RMSE_max_fraction: 1.10
    fold3_RMSE_max_fraction: 1.25
    p99_max_fraction: 1.25
    endpoint_12h_max_fraction: 1.25
    target_time_equal_max_fraction: 1.20
    fold3_target_time_equal_max_fraction: 1.25
  promising_B:
    formal_RMSE_lower_exclusive_fraction: 1.10
    formal_RMSE_upper_inclusive_fraction: 1.20
    required_improvement_fraction_on_one_preordered_axis: 0.10
    axis_order: [fold3_RMSE, endpoint_12h_RMSE, p99]
  eligible_for_extra_seeds: [PDFNET_INSPIRED_STRONGLY_PROMISING, PDFNET_INSPIRED_PROMISING_A, PDFNET_INSPIRED_PROMISING_B]
multiseed_gate:
  strong_formal_mean_fraction: 0.97
  strong_paired_seeds_better_minimum: 2
  strong_each_seed_formal_max_fraction: 1.10
  strong_fold3_p99_target_time_max_fraction: 1.10
  strong_fold3_target_time_endpoint_max_fraction: 1.15
  promising_only_requires_two_of_three_paired_seed_criteria: true
required_audits: [protocol, window_identity, core_gradients, no_test, all_legal_origins_retained, no_future_13_variable_supervision]
terminal_outcomes: [PDFNET_INSPIRED_NO_PROMISE, PDFNET_INSPIRED_PROMISING_ONLY, PDFNET_INSPIRED_STRONGLY_PROMISING, PROTOCOL_FAIL, IMPLEMENTATION_FAIL, RESOURCE_INFEASIBLE]
