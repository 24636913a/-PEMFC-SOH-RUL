preflight:
  required_models: [TimesNet, SimpleTM, DUET, ModernTCN]
  synthetic_input_shape: [4, 48, 14]
  required_voltage_output_shape: [4, 24]
  require_finite_output_loss_input_gradient_parameter_gradient: true
  common_batch_training_step: 64
  gpu_peak_memory_measurement: true
  failure_rule: implementation_not_clean_without_second_configuration
  timesnet_control_must_pass: true

metrics:
  formal_name: forecast_query_weighted_RMSE
  formal_formula: mean_over_folds_of_sqrt(mean_over_all_origin_horizon_queries_of_squared_deltaV_error)
  target_time_sensitivity_name: target_time_equal_weight_RMSE
  target_time_sensitivity_formula: mean_over_folds_of_sqrt(mean_over_unique_target_rows_of_mean_over_queries_to_target_of_squared_deltaV_error)
  endpoint: horizon_step_24_12h_RMSE
  tail_errors: [P95_absolute_error, P99_absolute_error, max_absolute_error]
  retain_extreme_target_age_h: 1130.25

seed42_gate:
  applies_to: [SimpleTM, DUET, ModernTCN]
  all_conditions_required: true
  formal_RMSE_at_most_timesnet_fraction: 0.95
  fold3_RMSE_at_most_timesnet_fraction: 1.03
  threefold_equal_P99_at_most_timesnet_fraction: 1.05
  target_time_equal_threefold_at_most_timesnet_fraction: 1.05
  target_time_equal_fold3_at_most_timesnet_fraction: 1.10
  compliance_required:
    - no_test_leakage
    - no_external_feature_decomposition
    - implementation_clean
    - all_legal_origins_retained
    - official_body_compliant
  failure_action: no_additional_seed_and_permanent_challenger_exit

multiseed_final_gate:
  timesnet_always_runs: [42, 2024, 3407]
  challenger_runs_extra_seeds_only_if_seed42_gate_passes: [2024, 3407]
  minimum_formal_mean_improvement_fraction: 0.05
  minimum_paired_seeds_better_than_timesnet: 2
  maximum_fold3_mean_fraction_of_timesnet: 1.03
  maximum_p99_fraction_of_timesnet: 1.05
  maximum_target_time_equal_fraction_of_timesnet: 1.05
  maximum_fold3_target_time_equal_fraction_of_timesnet: 1.10
  tie_break_if_formal_gap_less_than_timesnet_mean_fraction: 0.01
  tie_break_order: [fewer_parameters, lower_fold3_RMSE, lower_P99]
  permitted_final_statuses: [TIMESNET_FREEZE, SIMPLETM_PROMOTED, DUET_PROMOTED, MODERNTCN_PROMOTED]
  no_passing_challenger_status: TIMESNET_FREEZE

terminal_rule:
  backbone_search_permanently_ends_after_final_decision: true
  no_MW2_TTD2_R0_or_other_posthoc_cache_diagnostic: true
  no_automatic_future_condition_predictor_gate_or_FiLM: true
  next_phase_design_only: [Raw_F2, EMD_derived, VMD_derived, selected_degradation_modes_and_feature_selection]
  next_phase_execution_in_this_phase: prohibited
