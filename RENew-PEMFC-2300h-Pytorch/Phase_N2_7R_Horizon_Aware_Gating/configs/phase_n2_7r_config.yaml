phase_name: "Phase N2.7R — Horizon-Aware Adaptive Gating Feasibility Reassessment"
project_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch"
phase_n2_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch/Phase_N2_Model_Screening"
phase_n2_5_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch/Phase_N2_5_Cycle_Aware_xLSTM"
phase_n2_6r_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch/Phase_N2_6R_High_Fidelity_Revalidation"
phase_n2_7_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch/Phase_N2_7_Complementarity_and_Robustness"
phase_n2_7r_root: "E:/沈农信电/ PEMFC-SOH+RUL/RENew-PEMFC-2300h-Pytorch/Phase_N2_7R_Horizon_Aware_Gating"
n2_7_frozen_config: "Phase_N2_7_Complementarity_and_Robustness/outputs/frozen_config/PHASE_N2_7_FINAL_EXPERT_SELECTION.yaml"

data:
  primary_csv: "Phase_N1_Data_Foundation/outputs/causal_feature_tables/causal_features_30min.csv"
  ageing_column: bin_center_ophrs2_h
  bin_start_column: bin_start_ophrs2_h
  bin_end_column: bin_end_ophrs2_h
  datetime_column: last_datetime
  target_column: cell_voltage_mean
  valid_column: bin_valid_for_windows
  segment_column: temporal_segment_id

split:
  min_h: 72.788690
  fold_1_train_end_h: 946.393214
  fold_1_validation_end_h: 1164.794345
  fold_2_train_end_h: 1164.794345
  fold_2_validation_end_h: 1383.195476
  fold_3_train_end_h: 1383.195476
  development_end_h: 1819.997738
  test_end_h: 2256.800000

task:
  resolution_hours: 0.5
  lookback_hours: 24
  lookback_steps: 48
  horizon_hours: 12
  horizon_steps: 24

features:
  - cell_voltage_mean
  - cell_voltage_std
  - cell_voltage_range
  - cell_voltage_min
  - cell_voltage_max
  - actual_current_A_mean
  - actual_current_A_std
  - actual_current_A_peak_to_peak
  - actual_current_density_A_cm2_mean
  - actual_current_density_A_cm2_std
  - actual_current_density_A_cm2_peak_to_peak
  - load_transition_count
  - operation_point_transitions
  - zero_current_fraction

g0_features:
  cell_voltage_mean: [mean, std, min, max, last, slope]
  cell_voltage_std: [mean, last, slope]
  actual_current_A_mean: [mean, std, last, slope]
  actual_current_A_std: [mean, last, slope]
  actual_current_A_peak_to_peak: [mean, last]
  load_transition_count: [mean, sum, last, slope]
  operation_point_transitions: [mean, sum, last, slope]
  zero_current_fraction: [mean, last, slope]
  mahalanobis_shift_score: [origin_value]

gate_models:
  Gate_A_Horizon_Logistic:
    family: LogisticRegression
    feature_groups: [G0, G1]
    C: 1.0
    class_weight: balanced
    max_iter: 2000
  Gate_B_Disagreement_Logistic:
    family: LogisticRegression
    feature_groups: [G0, G1, G2]
    C: 1.0
    class_weight: balanced
    max_iter: 2000
  Gate_C_Continuous_MLP:
    family: MLP
    feature_groups: [G0, G1, G2]
    hidden_dimensions: [32, 16]
    dropout: 0.1
    optimizer: Adam
    learning_rate: 0.001
    batch_size: 256
    max_epochs: 300
    early_stopping_patience: 35
    min_delta: 0.000001

fixed_timesnet_weight: 0.25
horizon_static_candidate_weights: [0.0, 0.25, 0.50, 0.75, 1.0]
seeds: [42, 2024, 3407]
screening_seed: 42
meta_evaluations:
  meta_1_fold2_oos:
    train_folds: [fold_1]
    evaluation_fold: fold_2
  meta_2_fold3_oos:
    train_folds: [fold_1, fold_2]
    evaluation_fold: fold_3

bootstrap:
  repetitions: 2000
  block_length_origins: 19
  seed: 20260909

selection:
  adaptive_min_improvement_vs_fixed: 0.02
  adaptive_min_improvement_vs_lstm: 0.05
  horizon_static_within_best_gate_fraction: 0.01
  gate_weight_std_minimum: 0.01
  ophrs_main_replacement_requires_fraction: 0.05
