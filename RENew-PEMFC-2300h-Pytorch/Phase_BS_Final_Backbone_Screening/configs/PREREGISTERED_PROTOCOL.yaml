    SimpleTM: [official_SWT_decomposition, official_SWT_reconstruction, official_GeomAttention]
    DUET: [official_temporal_MoE_clustering, official_channel_soft_clustering]
    ModernTCN: [official_patching, official_large_small_kernel_convolution]
  no_new_feature_selection: true
  no_SG_update: true
  no_fifth_model: true
  source_phase_writes: prohibited

data_firewall:
  csv: Phase_N1_Data_Foundation/outputs/causal_feature_tables/causal_features_30min.csv
  pandas_read_csv_nrows: 3007
  expected_prefix_rows: 3007
  expected_development_rows_after_end_filter: 3005
  prohibited_operations:
    - scan_full_csv_for_split_or_test_metadata
    - read_rows_after_nrows_prefix
    - read_or_construct_test_targets_features_predictions_or_metrics
  required_columns:
    - bin_start_ophrs2_h
    - bin_end_ophrs2_h
    - last_datetime
    - temporal_segment_id
    - bin_valid_for_windows
    - cell_voltage_mean
    - cell_voltage_std
    - cell_voltage_range
    - cell_voltage_min
    - cell_voltage_max
    - actual_current_A_mean
    - actual_current_A_std
    - actual_current_A_peak_to_peak
    - actual_current_density_A_cm2_mean
    - actual_current_density_A_cm2_std
    - actual_current_density_A_cm2_peak_to_peak
    - load_transition_count
    - operation_point_transitions
    - zero_current_fraction
  f2_raw_feature_order:
    - cell_voltage_mean
    - cell_voltage_std
    - cell_voltage_range
    - cell_voltage_min
    - cell_voltage_max
    - actual_current_A_mean
    - actual_current_A_std
    - actual_current_A_peak_to_peak
    - actual_current_density_A_cm2_mean
    - actual_current_density_A_cm2_std
    - actual_current_density_A_cm2_peak_to_peak
    - load_transition_count
    - operation_point_transitions
    - zero_current_fraction

task:
  input_shape: [batch, 48, 14]
  resolution_h: 0.5
  lookback_steps: 48
  forecast_steps: 24
  target: cell_voltage_mean_t_plus_h_minus_cell_voltage_mean_t
  voltage_feature_index: 0
  model_output_contract: standardized_future_absolute_voltage_channel_0
  training_prediction_delta: standardized_future_voltage_channel_0_minus_standardized_origin_voltage_anchor
  training_target_delta: true_delta_voltage_divided_by_train_voltage_scale
  future_covariates: prohibited
  auxiliary_output_supervision: prohibited
  delta_inverse_transform: prediction_delta_standardized_times_train_voltage_scale

folds:
  - fold: fold_1
    train_start_h: 72.788690
    train_end_h: 946.393214
    validation_start_h: 946.393214
    validation_end_h: 1164.794345
  - fold: fold_2
    train_start_h: 72.788690
    train_end_h: 1164.794345
    validation_start_h: 1164.794345
    validation_end_h: 1383.195476
  - fold: fold_3
    train_start_h: 72.788690
    train_end_h: 1383.195476
    validation_start_h: 1383.195476
    validation_end_h: 1819.997738
development_end_h_exclusive: 1819.997738
window_rules:
  continuity_h: 0.5
  all_history_and_target_bins_valid: true
  one_temporal_segment_only: true
  target_end_must_not_cross_region: true
  matched_origins_across_models: true
  retain_all_legal_origins_and_extreme_targets: true

inner_stopping:
  stopper_fraction_of_outer_train_legal_origins: 0.15
  temporal_direction: last_origins
  target_row_overlap_between_fit_and_stopper: prohibited
  scaler_fit_population: fit_origins_only
  selection_metric: inner_deltaV_RMSE_mV
  final_refit: same_seed_reinitialize_on_full_outer_train
  final_scaler_fit_population: full_outer_train_only

training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 64
  max_epochs: 300
  patience: 30
  gradient_clip_norm: 1.0
  loss: common_DeltaV_standardized_MSE
  shuffle: torch_generator_seeded
  num_workers: 0
  seeds: [42, 2024, 3407]
  first_stage_seed: 42
  gpu_resource_assumption: RTX_3070_Laptop_8GB_to_be_verified_by_preflight

