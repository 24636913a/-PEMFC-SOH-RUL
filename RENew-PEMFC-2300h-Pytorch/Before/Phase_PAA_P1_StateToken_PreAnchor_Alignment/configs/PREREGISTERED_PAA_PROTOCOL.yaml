    - {checkpoint_h: 1150, incomplete_raw_cycle_id: 101, cycle_start_run_id: 70187, pre_characterization_last_run_id: 70594, pre_characterization_cutoff_datetime: '2025-04-18T04:26:40.005000', pre_characterization_cutoff_ophrs2_h: 1130.87000}
    - {checkpoint_h: 1500, incomplete_raw_cycle_id: 126, cycle_start_run_id: 87475, pre_characterization_last_run_id: 87889, pre_characterization_cutoff_datetime: '2025-05-26T21:45:55.005000', pre_characterization_cutoff_ophrs2_h: 1463.38000}
    - {checkpoint_h: 1750, incomplete_raw_cycle_id: 151, cycle_start_run_id: 105001, pre_characterization_last_run_id: 105420, pre_characterization_cutoff_datetime: '2025-06-10T15:54:57.005000', pre_characterization_cutoff_ophrs2_h: 1719.31000}
anchor_alignment:
  local_window_h: 48
  interval_unit: distinct_complete_or_pre_characterization_partial_cycle_interval
  intervals_per_anchor: 3
  selection: latest_3_legal_intervals_by_measurement_end_before_checkpoint_cutoff_not_by_voltage
  legal_interval_requirements: [within_48h, complete_7_variable_condition_vector, full_P1S_middle50_dwell_ended_before_cutoff, unique_interval_id]
  anchor_condition_support: at_least_2_of_3_selected_intervals_in_complete_cycle_joint_common_support
  coverage: {aligned_non_BoL_min: 5, required_checkpoints_h: [1500, 1750]}
polarization_after_all_preanchor_gates_pass_only:
  allowlisted_nominal_checkpoints: [BoL, 300, 600, 850, 1150, 1500, 1750]
  forbidden: [2000, 2300, afterAirAirStart, Test_EIS]
  required_cell_count: 10
  primary_jstar_A_cm2: 1.0
  secondary_jstar_A_cm2: 1.6
  density_tolerance_A_cm2: 0.01
  compatibility: {primary_spearman_positive_min: 0.60, informative_transitions_min: 3, same_direction_fraction_min: 0.75, secondary_no_strong_reverse_min: -0.30}
raw_firewall:
  development_test_boundary_h: 1819.997738
  maximum_required_precharacterization_cutoff_h: 1719.31000
  maximum_source_file: Loadcycle_data/Loadcycle_data/Loadcycle_134-150.csv
