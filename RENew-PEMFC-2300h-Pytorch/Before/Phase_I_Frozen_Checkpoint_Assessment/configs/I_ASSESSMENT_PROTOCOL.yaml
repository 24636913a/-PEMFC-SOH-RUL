  - 42
  - 52
  - 62
  differences:
  - F1-F0
  - F2-F1
  - F2-F0
  negative: new/minuend model has lower RMSE
  relative_improvement: (reference_RMSE-new_RMSE)/reference_RMSE*100
  SD: ddof=1
  aggregation: arithmetic mean of 3 seed-specific metrics; pooled metric is separately
    labelled; no ensemble
scientific_decision:
  all3_F2_better_F0_and_F1: F2_DEVELOPMENT_ASSESSMENT_MULTISEED_GAIN_OBSERVED
  all3_F2_better_F1_not_all3_F0: F2_GATE_GAIN_WITHOUT_NATIVE_SUPERIORITY
