architecture:
  embedding_dimension: 128
  resource_fallback:
    permitted_before_any_development_score_only: true
    microbatch_order: [64, 32, 16, 8]
    effective_batch_size: 64
    single_allowed_dimension_fallback: 128_to_64
  top_k_distinct_periods: 2
  period_mapping: clip(floor(D/f + 0.5), 2, D)
  period_selection:
    rfft_axis: embedding_dimension
    per_sample: true
    variable_amplitude_aggregation: mean_over_14_variables
    exclude_DC: true
    duplicate_integer_period_rule: continue_frequency_rank_until_two_unique
  padding:
    direction: right_zero_padding
    validity_mask: required
    padded_values_excluded_from_valid_means: true
  inner_period_bridge:
    classification: EXPLORATORY_BRIDGE
    q_mapping: clip(floor(p_outer/f_inner + 0.5), 2, p_outer)
  conv1d:
    classification: PAPER_EQUATION_INTERPRETATION
    shared_across_variables_periods_and_branches: true
    in_channels: 1
    out_channels: 1
    kernel_size: 3
    stride: 1
    padding: 1
    activation: none
    normalization: none
  variable_attention:
    classification: PAPER_EQUATION_INTERPRETATION
    equation: 8
    qkv_bias: false
    axis: variables
    equation_text_conflict: true
  patch_to_gpru:
    classification: CORE_EXPLORATORY_BRIDGE
    rule: patch_conv_right_pad_to_D_then_WV_then_E_times_patch_value
  gpru:
    classification: PAPER_VERIFIED
    equation: 9
    shared_across_patch_and_period_level: true
    shared_across_period_branches: true
    bias_shape: [14, D]
    bias_evidence: "PDFNet.pdf p.5 Eq. (9): b_r,b_u,b_o in R^(N x D)"
    hidden_initialization: H_j0_equals_E_times_V
    cross_outer_segment_hidden_transfer: prohibited
  base_graph:
    classification: CORE_EXPLORATORY_BRIDGE
    rule: A_equals_current_sample_current_branch_attention_E
  gated_dynamic_graph:
    classification: PAPER_VERIFIED_with_base_graph_bridge
    equations: [10, 11]
    directed_dense_graph: true
    retain_diagonal: true
    topk_or_threshold_or_static_node_embedding: prohibited
  mixhop:
    classification: EXPLORATORY_BRIDGE
    equations: [12, 13]
    hop_depth: 2
    beta: 0.5
    A_and_AT_paths: equal_mean_CORE_EXPLORATORY_BRIDGE
    W_ell_shared_between_paths: true
  intra_to_inter:
    classification: CORE_EXPLORATORY_BRIDGE
    patch_aggregate: valid_patch_mean
    period_aggregate: valid_outer_period_mean
  within_branch:
    classification: ENGINEERING_DEFAULT
    layers: [Linear_D_D, GELU, Linear_D_D, LayerNorm_D]
  multi_period_fusion:
    classification: CORE_EXPLORATORY_BRIDGE
    rule: softmax_of_two_trainable_scalar_logits_initialized_zero
  forecast_head:
    classification: ENGINEERING_DEFAULT
    shared_across_variables: true
    layers: [Linear_D_D, GELU, Linear_D_24]
    dropout: 0.0
  forbidden_additions: [custom_LSTM_head, Transformer_head, FiLM, RevIN, BatchNorm, PINN, auxiliary_future_loss, external_decomposition, dynamic_MLP_fusion]
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.00001
  scheduler: none
  effective_batch_size: 64
  max_epochs: 300
  patience: 30
