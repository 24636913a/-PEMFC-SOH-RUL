architecture:
  name: strict_history_TFT_adaptation
  continuous_embedding_size: 16
  recurrent_layers: 1
  attention_heads: 4
  grn_hidden_size: 32
  dropout: 0.1
  causal_attention: true
  output_voltage_channels: 1
  preserved_components: [continuous_variable_selection, gated_residual_networks, local_recurrent_encoder_decoder, causal_interpretable_attention, gating, absolute_voltage_output_head]
