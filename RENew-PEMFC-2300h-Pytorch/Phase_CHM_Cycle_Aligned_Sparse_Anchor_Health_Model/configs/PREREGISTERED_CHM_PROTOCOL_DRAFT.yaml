  pav_anchor_provenance: RENew-PEMFC-2300h-Pytorch/Phase_PAV_PAA_Anchor_Validity_Qualification/outputs/ANCHOR_MEDIAN_SUPPORT_PROVENANCE.csv

cycle_unit:
  source: Phase_RCR
  complete_cycles: 146
  rediscover_cycle_boundaries: false
  use_voltage_for_alignment: false
  use_health_for_alignment: false
  dtw_realignment: false

p1s_observation:
  operation_point: 221
  current_setpoint_A: 221.200
  state_token: '221||221.200'
  stable_dwell_window: middle_50_percent
  active_cells: [U1, U2, U3, U4, U5, U7, U8, U9, U10, U11]
  reference: earliest_10_legal_complete_cycles
  dense_observation_name: P1S_Operating_Voltage_Retention
  dense_observation_is_soh: false

per_cycle_inputs:
  required:
    - P1S_operating_voltage_retention
    - P1S_minus_reference_voltage
    - current_density
    - anode_inlet_temperature_C
    - anode_inlet_pressure_kPag
    - anode_inlet_RH_pct
    - anode_hydrogen_flow_nl_min
    - anode_stoichiometry
    - cathode_stoichiometry
    - seven_condition_deviations_from_reference_median
  optional_if_frozen_before_execution:
    - P1S_intra_cycle_variability
  recurrence_state: previous_latent_state
  forbidden:
    - OpHrs2
    - cycle_index
    - absolute_DateTime
    - future_cycle_voltage
    - future_polarization_anchor
    - Test_data

sparse_polarization_supervision:
  development_non_BoL_checkpoints_h: [300, 600, 850, 1150, 1500, 1750]
  BoL_reference: true
  primary_current_density_A_cm2: 1.0
  target: V_pol_checkpoint_at_1_0_A_cm2_divided_by_V_pol_BoL_at_1_0_A_cm2
  temporal_qualification: TEMPORAL_ORDER_VERIFIED_6_OF_6
  registered_alignment_rule: PAA_pre_characterization_48h_3_intervals_2_of_3_joint_support
  median_source_inside_joint_support: 3_of_6
  primary_anchor_set: all_6_non_BoL_anchors
  sensitivity_S1_anchor_set: [300, 850, 1750]
  sensitivity_S1_model_selection_allowed: false
  hard_interpolation_allowed: false

primary_model:
  name: Monotone_Cycle_Latent_State_Network
  initial_state: H_0_equals_1
  transition: H_c_equals_H_c_minus_1_minus_step_scale_times_softplus_g_theta_X_c
  monotonicity_mechanism: structural_softplus_decrement
  hard_clipping_allowed: false
  g_theta_max_layers: 2
  g_theta_hidden_width_max: 32
  parameter_count_target_less_than: 10000
  forbidden_architectures: [Transformer, xLSTM, Mamba, KAN, large_attention, graph_network]

loss_design:
  anchor: sum_normalized_w_k_times_H_anchor_cycle_minus_sparse_anchor_squared
  observation: sum_huber_H_c_minus_affine_phi_of_R_c
  calibration_mapping: phi_R_equals_aR_plus_b
  smoothness: sum_second_difference_H_squared
  total: lambda_anchor_L_anchor_plus_lambda_obs_L_obs_plus_lambda_smooth_L_smooth
  monotonic_penalty_added: false
  anchor_weight_design:
    raw_variance: sigma_pol_squared_plus_sigma_cycle_squared
    raw_weight: one_over_raw_variance_plus_epsilon
    normalization: divide_by_mean_raw_weight
    residual_reweighting_allowed: false
  candidate_lambda_values_pending_freeze:
    lambda_anchor: [1, 3, 10]
    lambda_obs: [0.3, 1, 3]
    lambda_smooth: [0.01, 0.1, 1]

baselines_pending_implementation_freeze:
  B0: H_c_equals_R_c
  B1: monotone_isotonic_calibration_from_P1S_to_sparse_anchor
  B2: low_order_monotone_calibration_fit_from_P1S_to_sparse_anchor

evaluation:
  development_split_only: true
  random_split_allowed: false
  offline_retrospective_track: leave_one_anchor_out
  causal_online_track: chronological_prefix_anchor_holdout
  held_out_anchor_used_for_training: false
  held_out_anchor_used_for_lambda_selection: false
  held_out_anchor_used_for_early_stopping: false
  raw_cycle_observation_at_holdout: allowed_as_unlabelled_causal_observation
  metrics:
    - per_checkpoint_anchor_MAE
    - per_checkpoint_anchor_RMSE
    - per_checkpoint_Spearman_rho
    - monotonic_violation_count
    - cycle_health_roughness
    - calibration_slope_and_bias
    - uncertainty_coverage
  qualification_gate:
    all_6_LOAO_predictions_legal: required
    aggregate_MAE_better_than_B0: required
    no_worse_than_best_interpretable_monotone_baseline: required
    no_structural_latent_health_increase: required
    bootstrap_coverage_reasonable: required
    S1_no_conclusion_reversal: required
    pass_status: DEVELOPMENT_HEALTH_MODEL_QUALIFIED

uncertainty:
  method: Block_Bootstrap_Ensemble
  resampling_unit: contiguous_complete_cycle_block
  resample_anchor_noise: Gaussian_from_frozen_checkpoint_uncertainty
  output: [cyclewise_median, cyclewise_2_5_percentile, cyclewise_97_5_percentile]
  block_length_cycles: PENDING_TECHNICAL_REVIEW
  ensemble_replicates: PENDING_TECHNICAL_REVIEW
  no_Bayesian_network: true

test_firewall:
  test_polarization_accessed: false
  test_EIS_accessed: false
  test_raw_accessed: false
  test_model_tuning: false
  test_checkpoints_h: [2000, 2300]
  after_Air_Air_role: future_intervention_recovery_sensitivity_only
  test_opening_requires: Phase_THV_after_all_development_choices_and_code_hashes_are_frozen

explicit_non_actions:
  neural_training: false
  backbone_search: false
  operation_point_search: false
  token_search: false
  new_anchor_rule_search: false
  SOH_interpolation: false
  RUL_training: false
  automatic_next_phase: false
