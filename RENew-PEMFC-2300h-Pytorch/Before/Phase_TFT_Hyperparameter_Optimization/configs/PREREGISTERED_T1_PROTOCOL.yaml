architecture_fixed:
  implementation: pytorch_forecasting.models.temporal_fusion_transformer.TemporalFusionTransformer
  package: pytorch-forecasting
  package_version: 1.8.0
  attention_head_size: 4
  lstm_layers: 1
  causal_attention: true
  decoder_known_variable: relative_forecast_step
  decoder_actual_covariates: prohibited
  output_size: 1

search:
  method: Optuna_TPE
  sampler_seed: 9137
  trials_per_outer_fold: 16
  trial_0: {learning_rate: 0.001, weight_decay: 0.00001, dropout: 0.1, hidden_size: 32, hidden_continuous_size: 16, batch_size: 64}
  learning_rate: {type: log_float, low: 0.0001, high: 0.002}
  weight_decay: {type: log_float, low: 0.000001, high: 0.001}
  dropout: {choices: [0.05, 0.1, 0.2]}
  width_combinations:
    - {hidden_size: 16, hidden_continuous_size: 8}
    - {hidden_size: 16, hidden_continuous_size: 16}
    - {hidden_size: 32, hidden_continuous_size: 8}
    - {hidden_size: 32, hidden_continuous_size: 16}
    - {hidden_size: 32, hidden_continuous_size: 32}
    - {hidden_size: 64, hidden_continuous_size: 8}
    - {hidden_size: 64, hidden_continuous_size: 16}
    - {hidden_size: 64, hidden_continuous_size: 32}
  batch_size: {choices: [32, 64]}
  pruner: none_except_duplicate_invalid_nan_or_oom

training:
  optimizer: AdamW
  gradient_clip_norm: 1.0
  max_epochs: 450
  patience: 40
  seed: 42
  chronological_inner_stopper_fraction: 0.15
  scaler_fit: inner_fit_only_then_full_outer_train_for_refit
  selection_metric: inner_deltaV_RMSE_mV
  final_refit: same_seed_reinitialize_on_full_outer_train_for_selected_inner_epoch
  loss: standardized_deltaV_MSE

evaluation:
  formal_primary: three_fold_equal_forecast_query_weighted_RMSE_mV
  metrics: [RMSE_mV, MAE_mV, R2, endpoint_RMSE_mV, P95_absolute_error_mV, P99_absolute_error_mV, max_absolute_error_mV, target_time_equal_RMSE_mV]
  fixed_outer_validation_origin_target_truth_match_to_T0: required
  independent_samples_claim_for_overlapping_queries: prohibited

